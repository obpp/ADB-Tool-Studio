<!doctype html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adb 反向隧道 · ADB Tool Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-tool="ssh_tunnel">

<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <header class="nameplate">
      <div class="nameplate-top">
        <span id="badge" class="badge" data-tone="idle" aria-live="polite">
          <span class="badge-icon" aria-hidden="true">■</span><span class="badge-text">未建立</span>
        </span>
        <h1>adb 反向隧道</h1>
        <span class="uptime" id="meta-uptime">—</span>
      </div>

      <!-- 功能简述：内容由 shell.js 从 /api/tools 的 desc 填进来 -->
      <p class="nameplate-desc" id="tool-desc"></p>

      <div class="readout" role="group" aria-label="隧道统计">
        <span class="ro"><span class="ro-k">隧道</span><span class="ro-v" id="meta-tunnel">—</span></span>
        <span class="ro"><span class="ro-k">连接次数</span><span class="ro-v" id="kpi-connects">0</span></span>
        <span class="ro"><span class="ro-k">异常退出</span><span class="ro-v" id="kpi-failures">0</span></span>
        <span class="ro"><span class="ro-k">上次连通</span><span class="ro-v" id="kpi-last">—</span></span>
        <span class="ro"><span class="ro-k">退出码</span><span class="ro-v" id="meta-exit">—</span></span>
      </div>

      <div class="actions">
        <button id="btn-start" class="btn primary" type="button">建立隧道</button>
        <button id="btn-stop" class="btn danger" type="button" disabled>断开</button>
      </div>
    </header>

    <div class="cmdbar">
      <pre id="cmd-preview" class="cmdbox">正在生成…</pre>
      <button id="btn-copy" class="btn ghost small" type="button">复制</button>
      <span id="copy-status" class="form-status" role="status"></span>
    </div>
    <p id="cmd-warn" class="cmd-warn" hidden></p>

    <div class="rule"></div>

    <div class="workspace">

      <section class="pane pane-params">

        <div class="pane-head">
          <h2 class="pane-title">参数</h2>
        </div>

        <form id="config-form" class="config-grid">

          <label class="field span-2">
            <span class="field-label">远程主机</span>
            <input id="cfg-host" type="text" autocomplete="off" spellcheck="false">
          </label>

          <label class="field">
            <span class="field-label">SSH 用户名</span>
            <input id="cfg-user" type="text" autocomplete="off" spellcheck="false">
          </label>

          <label class="field">
            <span class="field-label">SSH 端口</span>
            <input id="cfg-sshport" type="number" min="1" max="65535" step="1">
          </label>

          <label class="field span-2">
            <span class="field-label">私钥文件</span>
            <input id="cfg-identity" type="text" autocomplete="off" spellcheck="false"
                   placeholder="留空则用 ssh 默认密钥">
          </label>

          <label class="field">
            <span class="field-label">远程绑定端口</span>
            <input id="cfg-remoteport" type="number" min="1" max="65535" step="1">
          </label>

          <label class="field">
            <span class="field-label">本地地址</span>
            <input id="cfg-localhost" type="text" autocomplete="off" spellcheck="false">
          </label>

          <p id="port-hint" class="hint span-2" role="status" hidden></p>

          <label class="field">
            <span class="field-label">本地端口</span>
            <input id="cfg-localport" type="number" min="1" max="65535" step="1">
          </label>

          <label class="field">
            <span class="field-label">断线重连间隔（秒）</span>
            <input id="cfg-reconnect" type="number" min="0.5" max="3600" step="0.5">
          </label>

          <label class="field">
            <span class="field-label">主机指纹校验</span>
            <select id="cfg-hostkey">
              <option value="accept-new">自动接受新的</option>
              <option value="yes">严格校验</option>
              <option value="no">不校验（不安全）</option>
            </select>
          </label>

          <label class="field span-2">
            <span class="field-label">ssh 可执行文件</span>
            <input id="cfg-ssh" type="text" autocomplete="off" spellcheck="false">
          </label>

          <div class="field checks span-2">
            <label class="check"><input id="cfg-autoreconnect" type="checkbox"> 断线自动重连</label>
            <label class="check"><input id="cfg-keepalive" type="checkbox"> 发送心跳保活</label>
            <label class="check"><input id="cfg-batchmode" type="checkbox"> 禁止交互式提问</label>
            <label class="check"><input id="cfg-gateway" type="checkbox"> 绑定到 0.0.0.0（需远程开 GatewayPorts）</label>
          </div>

          <div class="form-actions span-2">
            <button class="btn primary" type="submit">保存参数</button>
            <span id="cfg-status" class="form-status" role="status"></span>
          </div>
        </form>

      </section>

      <section class="pane pane-log">
        <div class="pane-head">
          <h2 class="pane-title">日志</h2>
          <div class="pane-tools">
            <label class="check small"><input id="follow" type="checkbox" checked> 跟随最新</label>
            <button id="btn-clear" class="btn ghost small" type="button">清空</button>
          </div>
        </div>
        <div id="log" class="log" role="log" aria-label="运行日志"></div>
      </section>

    </div>
  </main>
</div>

<!-- 服务端环境变量提醒：远程端口不是默认值时，远程 adb 客户端要跟着改 -->
<div class="picker" id="env-modal" hidden role="dialog" aria-modal="true"
     aria-labelledby="env-title">
  <div class="picker-panel env-panel">
    <div class="pane-head">
      <h2 class="pane-title" id="env-title">服务端 adb 端口设置</h2>
      <button id="env-close" class="btn ghost small" type="button">关闭</button>
    </div>

    <p id="env-note" class="hint"></p>

    <div class="env-command">
      <code id="env-command"></code>
      <button id="env-copy" class="btn ghost small" type="button">复制</button>
      <span id="env-copy-status" class="form-status" role="status"></span>
    </div>

    <p id="env-hint" class="hint"></p>

    <label class="check"><input id="env-mute" type="checkbox"> 不再提示</label>

    <div class="form-actions">
      <button id="env-ok" class="btn primary" type="button">知道了</button>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/ssh-tunnel.js"></script>
</body>
</html>
