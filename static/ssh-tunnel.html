<!doctype html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adb 反向隧道 · my-adb-app</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="brand-mark" href="/" aria-label="返回首页">adb</a>
    <div class="brand-text">
      <h1>adb 反向隧道</h1>
      <p class="sub">把本机 adb server 反向映射到远程主机</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="conn" class="conn" data-state="connecting">
      <span class="conn-dot" aria-hidden="true"></span><span id="conn-text">连接中…</span>
    </span>
    <button id="theme" class="btn ghost" type="button" aria-label="切换浅色/深色主题">深色</button>
  </div>
</header>

<nav class="crumb">
  <a href="/">my-adb-app</a>
  <span class="sep">/</span>
  <span>adb 反向隧道</span>
</nav>

<main>

  <section class="card status-card">
    <div class="status-main">
      <span id="badge" class="badge" data-tone="idle" aria-live="polite">
        <span class="badge-icon" aria-hidden="true">■</span><span class="badge-text">未建立</span>
      </span>
      <dl class="meta">
        <div><dt>隧道</dt><dd id="meta-tunnel">—</dd></div>
        <div><dt>已运行</dt><dd id="meta-uptime">—</dd></div>
        <div><dt>上次连通</dt><dd id="meta-connected">—</dd></div>
        <div><dt>上次退出码</dt><dd id="meta-exit">—</dd></div>
      </dl>
    </div>
    <div class="actions">
      <button id="btn-start" class="btn primary" type="button">建立隧道</button>
      <button id="btn-stop" class="btn danger" type="button" disabled>断开</button>
    </div>
  </section>

  <section class="kpis" aria-label="隧道统计">
    <div class="kpi">
      <span class="kpi-label">连接次数</span>
      <span class="kpi-value" id="kpi-connects">0</span>
      <span class="kpi-hint">ssh 被拉起的次数</span>
    </div>
    <div class="kpi">
      <span class="kpi-label">异常退出</span>
      <span class="kpi-value" id="kpi-failures">0</span>
      <span class="kpi-hint">非 0 返回码</span>
    </div>
    <div class="kpi">
      <span class="kpi-label">上次连通</span>
      <span class="kpi-value kpi-time" id="kpi-last">—</span>
      <span class="kpi-hint">最近一次 ssh 拉起成功</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>命令行</h2>
      <span class="card-note">这就是本页实际执行的命令，改了参数会实时跟着变</span>
    </div>
    <div class="cmd-row">
      <pre id="cmd-preview" class="cmdbox">正在生成…</pre>
      <button id="btn-copy" class="btn ghost small" type="button">复制</button>
      <span id="copy-status" class="form-status" role="status"></span>
    </div>
    <p id="cmd-warn" class="cmd-warn" hidden></p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>参数</h2>
      <span class="card-note">改动会写入 <code>config/ssh_tunnel.json</code>；点「建立隧道」会先保存</span>
    </div>
    <form id="config-form" class="config-grid">

      <label class="field">
        <span class="field-label">远程主机（IP 或域名）</span>
        <input id="cfg-host" type="text" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field-label">SSH 用户名</span>
        <input id="cfg-user" type="text" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field-label">SSH 端口</span>
        <input id="cfg-sshport" type="number" min="1" max="65535" step="1">
      </label>

      <label class="field">
        <span class="field-label">主机指纹校验</span>
        <select id="cfg-hostkey">
          <option value="accept-new">自动接受新的（首次自动写入 known_hosts）</option>
          <option value="yes">严格校验</option>
          <option value="no">不校验（不安全）</option>
        </select>
      </label>

      <label class="field span-2">
        <span class="field-label">私钥文件（可选，留空则用 ssh 默认的密钥）</span>
        <input id="cfg-identity" type="text" autocomplete="off" spellcheck="false"
               placeholder="例如 C:\Users\me\.ssh\id_rsa">
      </label>

      <label class="field">
        <span class="field-label">远程绑定端口</span>
        <input id="cfg-remoteport" type="number" min="1" max="65535" step="1">
      </label>

      <label class="field">
        <span class="field-label">本地地址</span>
        <input id="cfg-localhost" type="text" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field-label">本地端口</span>
        <input id="cfg-localport" type="number" min="1" max="65535" step="1">
      </label>

      <label class="field">
        <span class="field-label">断线重连间隔（秒）</span>
        <input id="cfg-reconnect" type="number" min="0.5" max="3600" step="0.5">
      </label>

      <label class="field span-2">
        <span class="field-label">ssh 可执行文件</span>
        <input id="cfg-ssh" type="text" autocomplete="off" spellcheck="false">
      </label>

      <div class="field checks span-2">
        <label class="check"><input id="cfg-autoreconnect" type="checkbox"> 断线自动重连</label>
        <label class="check"><input id="cfg-keepalive" type="checkbox"> 发送心跳保活</label>
        <label class="check"><input id="cfg-batchmode" type="checkbox"> 禁止交互式提问（无终端时更稳）</label>
        <label class="check">
          <input id="cfg-gateway" type="checkbox">
          绑定到 0.0.0.0（需远程 sshd 开 <code>GatewayPorts</code>）
        </label>
      </div>

      <div class="form-actions span-2">
        <button class="btn primary" type="submit">保存参数</button>
        <span id="cfg-status" class="form-status" role="status"></span>
      </div>
    </form>
  </section>

  <section class="card log-card">
    <div class="card-head">
      <h2>运行日志</h2>
      <div class="card-tools">
        <label class="check small"><input id="follow" type="checkbox" checked> 跟随最新</label>
        <button id="btn-clear" class="btn ghost small" type="button">清空</button>
      </div>
    </div>
    <div id="log" class="log" role="log" aria-label="运行日志"></div>
  </section>

</main>

<script src="/static/common.js"></script>
<script src="/static/ssh-tunnel.js"></script>
</body>
</html>
