<!doctype html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>always-adb · ADB Tool Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-tool="always_adb">

<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <header class="nameplate">
      <div class="nameplate-top">
        <span id="badge" class="badge" data-tone="idle" aria-live="polite">
          <span class="badge-icon" aria-hidden="true">■</span><span class="badge-text">已停止</span>
        </span>
        <h1>always-adb</h1>
        <span class="uptime" id="meta-uptime">—</span>
      </div>

      <div class="readout" role="group" aria-label="运行统计">
        <span class="ro"><span class="ro-k">目标设备</span><span class="ro-v" id="meta-target">—</span></span>
        <span class="ro"><span class="ro-k">模式</span><span class="ro-v" id="meta-mode">—</span></span>
        <span class="ro"><span class="ro-k">轮次</span><span class="ro-v" id="kpi-rounds">0</span></span>
        <span class="ro"><span class="ro-k">成功</span><span class="ro-v" id="kpi-ok">0</span></span>
        <span class="ro"><span class="ro-k">重试</span><span class="ro-v" id="kpi-retries">0</span></span>
        <span class="ro" id="kpi-fail-tile" data-tone="ok">
          <span class="ro-k">连续失败</span><span class="ro-v" id="kpi-fails">0</span><span class="ro-note" id="kpi-fails-hint"></span>
        </span>
        <span class="ro"><span class="ro-k">上次成功</span><span class="ro-v" id="meta-last">—</span></span>
      </div>

      <div class="actions">
        <button id="btn-start" class="btn primary" type="button">开始循环</button>
        <button id="btn-once" class="btn" type="button">单次执行</button>
        <button id="btn-stop" class="btn danger" type="button" disabled>停止</button>
      </div>
    </header>

    <div class="rule"></div>

    <div class="workspace">

      <section class="pane pane-params">

        <div class="pane-head">
          <h2 class="pane-title">参数</h2>
        </div>

        <form id="config-form" class="config-grid">
          <label class="field span-2">
            <span class="field-label">adb 路径</span>
            <input id="cfg-adb" type="text" autocomplete="off" spellcheck="false">
          </label>

          <label class="field">
            <span class="field-label">目标设备</span>
            <select id="cfg-serial"></select>
          </label>

          <label class="field">
            <span class="field-label">写入值</span>
            <input id="cfg-value" type="text" inputmode="numeric" autocomplete="off">
          </label>

          <label class="field">
            <span class="field-label">失败重试间隔（秒）</span>
            <input id="cfg-retry" type="number" min="0.1" max="600" step="0.1">
          </label>

          <label class="field">
            <span class="field-label">每轮成功后等待（秒）</span>
            <input id="cfg-wait" type="number" min="0" max="86400" step="1">
          </label>

          <label class="field">
            <span class="field-label">单条命令超时（秒）</span>
            <input id="cfg-timeout" type="number" min="1" max="3600" step="1">
          </label>

          <div class="field checks span-2">
            <label class="check"><input id="cfg-doroot" type="checkbox"> 执行 <code>adb root</code></label>
            <label class="check"><input id="cfg-dosync" type="checkbox"> 执行 <code>adb shell sync</code></label>
            <label class="check"><input id="cfg-waitroot" type="checkbox"> root 后等待设备重新上线</label>
          </div>

          <div class="form-actions span-2">
            <button class="btn primary" type="submit">保存参数</button>
            <span id="cfg-status" class="form-status" role="status"></span>
          </div>
        </form>

        <div class="pane-head">
          <h2 class="pane-title">设备</h2>
          <button id="btn-refresh" class="btn ghost small" type="button">刷新</button>
        </div>
        <ul id="device-list" class="devices" aria-label="已连接的设备">
          <li class="dev-empty">加载中…</li>
        </ul>

      </section>

      <section class="pane pane-log">
        <div class="pane-head">
          <h2 class="pane-title">日志</h2>
          <div class="pane-tools">
            <label class="check small"><input id="follow" type="checkbox" checked> 跟随最新</label>
            <button id="btn-clear" class="btn ghost small" type="button">清空</button>
          </div>
        </div>
        <div id="log" class="log" role="log" aria-label="运行日志"></div>
      </section>

    </div>
  </main>
</div>

<script src="/static/common.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/always-adb.js"></script>
</body>
</html>
